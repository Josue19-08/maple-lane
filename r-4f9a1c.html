<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Formulario</title>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Josefin+Sans:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#3f9b54;--green-d:#2f7d42;--green-l:#e9f4ea;--red:#c8232c;--red-d:#a51c24;--ink:#33363a;--muted:#7a7f85;--line:#e7e9e4;--bg:#f5f8f3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Nunito,system-ui,sans-serif}
.top{background:var(--green);color:#fff;padding:14px 16px;font-family:Lobster,cursive;font-size:22px}
.wrap{max-width:520px;margin:0 auto;padding:18px 14px 40px}
.card{background:#fff;border-radius:14px;padding:20px 16px;box-shadow:0 2px 10px rgba(47,125,66,.08);border-top:4px solid var(--red)}
h1{font-family:Lobster,cursive;font-weight:400;color:var(--red);font-size:32px;line-height:1.1;margin:0 0 8px}
p{margin:0 0 12px;color:var(--muted);font-size:16px}
label{display:block;font:700 13px "Josefin Sans",sans-serif;color:var(--green-d);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.06em}
input{width:100%;padding:15px;border:1.5px solid var(--line);border-radius:10px;font:18px Nunito,sans-serif;background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--green)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:8px;padding:16px;font:700 16px "Josefin Sans",sans-serif;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;text-decoration:none;min-height:52px;margin-top:14px}
.pri{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-d)}
.wa{background:#25a35a;color:#fff}
.cp{background:#fff;color:var(--green-d);border:2px solid var(--green)}
.err{background:#fbe9ea;color:var(--red);border-radius:10px;padding:12px;font-size:15px;margin-top:12px;display:none;font-weight:600}
.code{word-break:break-all;background:var(--green-l);border-radius:10px;padding:12px;font:14px/1.4 ui-monospace,Menlo,monospace;color:var(--green-d);margin:10px 0 0;user-select:all}
.hidden{display:none}
</style>
</head>
<body>
<div class="top">Intercambio navideño</div>
<div class="wrap">
  <div class="card" id="f">
    <h1>Un favor rápido</h1>
    <p>Escriba el nombre de la persona a quien le tocó regalar. Se genera un código que usted me envía. Yo no puedo leerlo.</p>
    <label>Persona a quien le toca regalar</label>
    <input id="r" autocomplete="off" placeholder="Nombre de esa persona">
    <button class="btn pri" id="go">Generar código</button>
    <div class="err" id="err"></div>
  </div>
  <div class="card hidden" id="o">
    <h1>Listo</h1>
    <p>Envíeme este código. No lo comparta con nadie más.</p>
    <div class="code" id="code"></div>
    <a class="btn wa" id="wa" target="_blank" rel="noopener">Enviar por WhatsApp</a>
    <button class="btn cp" id="cp">Copiar código</button>
  </div>
</div>
<script>
(function(){
  var KEY="pura-vida-navidad-2026";
  function $(s){return document.querySelector(s)}
  function xor(bytes){var k=new TextEncoder().encode(KEY);return bytes.map(function(b,i){return b^k[i%k.length]^((i*31+7)&255)})}
  function hex(b){return b.map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
  function clean(v){return v.replace(/\s+/g," ").trim()}
  $("#go").onclick=function(){
    var r=clean($("#r").value), e=$("#err");
    e.style.display="none";
    if(!r){e.textContent="Escriba el nombre.";e.style.display="block";return}
    var raw=new TextEncoder().encode(JSON.stringify({g:"?",r:r,b:"",d:"",s:"help"}));
    var code="s-"+hex(xor(Array.from(raw)));
    $("#code").textContent=code;
    $("#wa").href="https://wa.me/?text="+encodeURIComponent(code);
    $("#f").classList.add("hidden");$("#o").classList.remove("hidden");
  };
  $("#cp").onclick=function(ev){
    var t=ev.target,c=$("#code").textContent;
    function ok(){t.textContent="Copiado"}
    function sel(){var rg=document.createRange();rg.selectNodeContents($("#code"));var s=getSelection();s.removeAllRanges();s.addRange(rg);t.textContent="Toque y mantenga para copiar"}
    try{navigator.clipboard.writeText(c).then(ok,sel)}catch(x){sel()}
  };
})();
</script>
</body>
</html>
